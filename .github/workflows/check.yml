name: Check Extension Updates

on:
    schedule:
        - cron: '0 */4 * * *'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check-updates:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup pnpm
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  runtime: node@24
                  cache: true

            - name: Check extension updates
              id: update
              run: pnpm run update:check

            - name: Format extensions.json
              if: steps.update.outputs.updated == 'true'
              run: pnpm run format

            - name: Commit and push changes
              if: steps.update.outputs.updated == 'true'
              run: |
                  set -euo pipefail
                  git config --local user.name 'github-actions[bot]'
                  git config --local user.email 'github-actions[bot]@users.noreply.github.com'
                  git add extensions.json
                  git diff-index --quiet HEAD || git commit -m 'chore: update extensions.json'
                  git push
