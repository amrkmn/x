name: Check Extension Updates

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check-updates:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  token: ${{ secrets.GH_TOKEN }}

            - name: Setup nub
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              run: nub ci

            - name: Check extension updates
              id: update
              run: nub run update:check

            - name: Format extensions.json
              if: steps.update.outputs.updated == 'true'
              run: nub run format

            - name: Commit and push changes
              if: steps.update.outputs.updated == 'true'
              run: |
                  set -euo pipefail
                  git config --local user.name 'github-actions[bot]'
                  git config --local user.email 'github-actions[bot]@users.noreply.github.com'
                  git add extensions.json
                  git diff-index --quiet HEAD || git commit -m 'chore: update extensions.json'
                  git push
