name: Publish Release Artifacts

on:
    push:
        branches:
            - main
        paths:
            - extensions.json
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-publisher-main
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 0

            - name: Setup nub
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              run: nub ci

            - name: Publish immutable releases
              run: nub run publish:releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
