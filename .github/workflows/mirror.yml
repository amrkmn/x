name: Mirror Repository

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Mirror to GitLab
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.GITLAB_SSH }}" > ~/.ssh/mirror_key
                  chmod 600 ~/.ssh/mirror_key
                  export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o StrictHostKeyChecking=no"
                  git remote add mirror "${{ secrets.GITLAB_REPO }}"
                  git push mirror refs/remotes/origin/main:refs/heads/main
                  git push mirror --tags
