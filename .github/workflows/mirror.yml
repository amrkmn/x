name: Mirror Repositories

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    mirror:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [forgejo, gitlab]

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Mirror to ${{ matrix.target }}
              run: |
                  case "${{ matrix.target }}" in
                    forgejo)
                      URL="${{ secrets.FORGEJO_REPO }}"
                      KEY="${{ secrets.FORGEJO_SSH }}"
                      ;;
                    gitlab)
                      URL="${{ secrets.GITLAB_REPO }}"
                      KEY="${{ secrets.GITLAB_SSH }}"
                      ;;
                  esac
                  mkdir -p ~/.ssh
                  echo "$KEY" > ~/.ssh/mirror_key
                  chmod 600 ~/.ssh/mirror_key
                  export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o StrictHostKeyChecking=no"
                  git remote add mirror "$URL"
                  git push mirror refs/remotes/origin/main:refs/heads/main
                  git push mirror --tags
