name: Mirror to Forgejo

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    sync-to-forgejo:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Push to Forgejo
              run: |
                  git remote add forgejo "${{ secrets.FORGEJO_MIRROR_URL }}"
                  git push forgejo 'refs/remotes/origin/*:refs/heads/*'
                  git push forgejo --tags
