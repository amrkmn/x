name: Update Extensions

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'extensions.json'
            - 'README.md'
            - '.github/workflows/check.yml'
            - '.github/workflows/publish.yml'
    workflow_run:
        workflows:
            - Publish Release Artifacts
        types:
            - completed
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository) }}
        strategy:
            matrix:
                include:
                    - target: cloudflare
                      site_url: https://x.noz.one
                      analytics_domain: x.noz.one
                    - target: netlify
                      site_url: https://x.ujol.dev
                      analytics_domain: x.ujol.dev
                    - target: grebedoc
                      site_url: https://x.amar.kim
                      analytics_domain: x.amar.kim
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Setup nub
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              run: nub ci

            - name: Fetch latest release manifest
              run: |
                  mkdir -p /tmp/manifest
                  curl -fSL -o /tmp/manifest/release-assets.json "https://github.com/${{ github.repository }}/releases/latest/download/release-assets.json"

            - name: Prepare dist
              run: nub run prepare:dist
              env:
                  RELEASE_MANIFEST_FILE: /tmp/manifest/release-assets.json
                  PUBLIC_MEILISEARCH_HOST: ${{ secrets.PUBLIC_MEILISEARCH_HOST }}
                  PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY: ${{ secrets.PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY }}
                  PUBLIC_SITE_URL: ${{ matrix.site_url }}
                  PUBLIC_ANALYTICS_DOMAIN: ${{ matrix.analytics_domain }}

            - name: Upload dist
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: dist-${{ matrix.target }}
                  path: dist/
                  retention-days: 1

    deploy:
        needs: build
        runs-on: ubuntu-slim
        strategy:
            fail-fast: false
            matrix:
                target: [cloudflare, netlify, grebedoc]
        steps:
            - name: Checkout repository
              if: matrix.target == 'cloudflare' || matrix.target == 'netlify'
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Download dist
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist-${{ matrix.target }}
                  path: dist

            - name: Setup nub
              if: matrix.target == 'cloudflare' || matrix.target == 'netlify'
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              if: matrix.target == 'cloudflare' || matrix.target == 'netlify'
              run: nub ci

            - name: Deploy to Cloudflare Workers
              if: matrix.target == 'cloudflare'
              run: nubx wrangler deploy --message "deploy ${{ github.event.workflow_run.head_sha || github.sha }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy to Netlify
              if: matrix.target == 'netlify'
              run: nubx netlify deploy --prod --dir dist --message "deploy ${{ github.event.workflow_run.head_sha || github.sha }}"
              env:
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

            - name: Deploy to grebedoc
              if: matrix.target == 'grebedoc'
              run: |
                  tar -I 'zstd -3' -cf dist.tar.zst -C dist .
                  curl -fSL https://grebedoc.dev/ -X PUT \
                      -H "Host: x.amar.kim" \
                      -H "Authorization: Pages $GIT_PAGES_PASSWORD" \
                      -H "Content-Type: application/x-tar+zstd" \
                      --data-binary @dist.tar.zst
              env:
                  GIT_PAGES_PASSWORD: ${{ secrets.GIT_PAGES_PASSWORD }}

    search-index:
        needs: [build, deploy]
        if: ${{ !cancelled() && needs.build.result == 'success' }}
        runs-on: ubuntu-slim
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Setup nub
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              run: nub ci

            - name: Download dist for search index
              uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: dist-cloudflare
                  path: dist

            - name: Update search index
              run: nub run search:update
              env:
                  SEARCH_INDEX_FILE: dist/indexes.json
                  MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
                  MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
