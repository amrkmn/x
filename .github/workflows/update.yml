name: Update Extensions

on:
    workflow_run:
        workflows:
            - Publish Release Artifacts
        types:
            - completed
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        outputs:
            dufs_enabled: ${{ steps.dufs.outputs.enabled }}

        steps:
            - name: Check DUFS sync config
              id: dufs
              run: |
                  if [ -n "$RCLONE_CONFIG" ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "RCLONE_CONFIG is not set; DUFS sync will be skipped."
                  fi
              env:
                  RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

    sync-to-dufs:
        runs-on: ubuntu-latest
        needs: setup
        if: needs.setup.outputs.dufs_enabled == 'true' && github.event.workflow_run.conclusion == 'success'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}

            - name: Setup pnpm
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  runtime: node@24
                  cache: true

            - name: Setup Rclone
              uses: AnimMouse/setup-rclone@26ef2133e09fd383329a1d4c1fbe6a71db1976c9 # v1.12.0
              with:
                  rclone_config: ${{ secrets.RCLONE_CONFIG }}

            - name: Fetch latest release manifest
              id: manifest
              run: |
                  TAG=$(gh release list --exclude-drafts --limit 30 --json tagName,createdAt -q 'max_by(.createdAt) | .tagName')
                  if [ -z "$TAG" ]; then
                      echo "No published releases yet; building with upstream URLs."
                      exit 0
                  fi
                  mkdir -p /tmp/manifest
                  gh release download "$TAG" --pattern release-assets.json --dir /tmp/manifest --clobber
                  echo "path=/tmp/manifest/release-assets.json" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare dist
              run: pnpm run prepare:dist
              env:
                  RELEASE_MANIFEST_FILE: ${{ steps.manifest.outputs.path }}
                  PUBLIC_MEILISEARCH_HOST: ${{ secrets.PUBLIC_MEILISEARCH_HOST }}
                  PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY: ${{ secrets.PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY }}
                  PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
                  PUBLIC_ANALYTICS_DOMAIN: ${{ secrets.PUBLIC_ANALYTICS_DOMAIN }}

            - name: Sync to DUFS
              run: |
                  rclone sync ./dist dufs: \
                      --transfers 20 \
                      --checkers 20 \
                      --retries 3 \
                      --retries-sleep 5s \
                      --log-level INFO \
                      --progress \
                      --stats-one-line-date

    publish-to-pages:
        runs-on: ubuntu-latest
        needs: setup
        if: github.event.workflow_run.conclusion == 'success'
        permissions:
            contents: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}

            - name: Setup pnpm
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  runtime: node@24
                  cache: true

            - name: Fetch latest release manifest
              id: manifest
              run: |
                  TAG=$(gh release list --exclude-drafts --limit 30 --json tagName,createdAt -q 'max_by(.createdAt) | .tagName')
                  if [ -z "$TAG" ]; then
                      echo "No published releases yet; building with upstream URLs."
                      exit 0
                  fi
                  mkdir -p /tmp/manifest
                  gh release download "$TAG" --pattern release-assets.json --dir /tmp/manifest --clobber
                  echo "path=/tmp/manifest/release-assets.json" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare dist
              run: pnpm run prepare:dist
              env:
                  RELEASE_MANIFEST_FILE: ${{ steps.manifest.outputs.path }}
                  PUBLIC_MEILISEARCH_HOST: ${{ secrets.PUBLIC_MEILISEARCH_HOST }}
                  PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY: ${{ secrets.PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY }}
                  PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
                  PUBLIC_ANALYTICS_DOMAIN: ${{ secrets.PUBLIC_ANALYTICS_DOMAIN }}

            - name: Publish to pages branch
              run: |
                  cd dist
                  git init -b pages
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add -A
                  git commit -m "deploy ${{ github.event.workflow_run.head_sha }}"
                  git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" pages
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
