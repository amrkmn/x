name: Update Extensions

on:
    workflow_run:
        workflows:
            - Publish Release Artifacts
        types:
            - completed
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    setup:
        runs-on: ubuntu-latest
        if: github.server_url == 'https://github.com' && github.event.workflow_run.conclusion == 'success'
        outputs:
            dufs_enabled: ${{ steps.dufs.outputs.enabled }}

        steps:
            - name: Check DUFS sync config
              id: dufs
              run: |
                  if [ -n "$RCLONE_CONFIG" ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "RCLONE_CONFIG is not set; DUFS sync will be skipped."
                  fi
              env:
                  RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}

    sync-to-gitlab:
        runs-on: ubuntu-latest
        if: github.server_url == 'https://github.com' && github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}
                  fetch-depth: 0

            - name: Sync to GitLab
              uses: pixta-dev/repository-mirroring-action@674e65a7d483ca28dafaacba0d07351bdcc8bd75 # v1.1.1
              with:
                  target_repo_url: ${{ secrets.GITLAB_REPO }}
                  ssh_private_key: ${{ secrets.GITLAB_SSH }}

    sync-to-dufs:
        runs-on: ubuntu-latest
        needs: setup
        if: needs.setup.outputs.dufs_enabled == 'true' && github.server_url == 'https://github.com' && github.event.workflow_run.conclusion == 'success'

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Setup Rclone
              uses: AnimMouse/setup-rclone@26ef2138e09fd383329a1d4c1fbe6a71db1976c # v1.12.0
              with:
                  rclone_config: ${{ secrets.RCLONE_CONFIG }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Prepare dist
              run: pnpm run prepare:dist
              env:
                  PUBLIC_MEILISEARCH_HOST: ${{ secrets.PUBLIC_MEILISEARCH_HOST }}
                  PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY: ${{ secrets.PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY }}
                  PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
                  PUBLIC_ANALYTICS_DOMAIN: ${{ secrets.PUBLIC_ANALYTICS_DOMAIN }}

            - name: Sync to DUFS
              run: |
                  rclone sync ./dist dufs: \
                      --transfers 20 \
                      --checkers 20 \
                      --retries 3 \
                      --retries-sleep 5s \
                      --log-level INFO \
                      --progress \
                      --stats-one-line-date
