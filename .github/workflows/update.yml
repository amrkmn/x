name: Update Extensions

on:
    workflow_run:
        workflows:
            - Publish Release Artifacts
        types:
            - completed
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.workflow_run.head_sha || 'main' }}

            - name: Setup pnpm
              uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
              with:
                  runtime: node@24
                  cache: true

            - name: Fetch latest release manifest
              id: manifest
              run: |
                  TAG=$(gh release list --exclude-drafts --limit 30 --json tagName,createdAt -q 'max_by(.createdAt) | .tagName')
                  if [ -z "$TAG" ]; then
                      echo "No published releases found; refusing to deploy without a complete manifest."
                      exit 1
                  fi
                  mkdir -p /tmp/manifest
                  gh release download "$TAG" --pattern release-assets.json --dir /tmp/manifest --clobber
                  echo "path=/tmp/manifest/release-assets.json" >> "$GITHUB_OUTPUT"
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Prepare dist
              run: pnpm run prepare:dist
              env:
                  RELEASE_MANIFEST_FILE: ${{ steps.manifest.outputs.path }}
                  PUBLIC_MEILISEARCH_HOST: ${{ secrets.PUBLIC_MEILISEARCH_HOST }}
                  PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY: ${{ secrets.PUBLIC_MEILISEARCH_DEFAULT_SEARCH_KEY }}
                  PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
                  PUBLIC_ANALYTICS_DOMAIN: ${{ secrets.PUBLIC_ANALYTICS_DOMAIN }}

            - name: Deploy to Cloudflare Workers
              run: pnpm wrangler deploy --message "deploy ${{ github.event.workflow_run.head_sha }}"
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

            - name: Deploy to Netlify
              run: pnpx netlify-cli deploy --prod --dir dist --site ${{ secrets.NETLIFY_SITE_ID }} --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} --message "deploy ${{ github.event.workflow_run.head_sha }}"
