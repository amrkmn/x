name: Clean Up Releases

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release-cleanup
    cancel-in-progress: false

jobs:
    cleanup:
        runs-on: ubuntu-slim
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.sha }}

            - name: Setup nub
              uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0

            - name: Install dependencies
              run: nub ci

            - name: Clean up unreferenced release assets
              run: nub run cleanup:releases
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
