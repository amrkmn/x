# Production deploys are built AND shipped by GitHub Actions
# (.github/workflows/update.yml): prepare-dist with the complete release
# manifest, then `netlify deploy --prod --dir dist`. The no-op command
# pins explicit build settings so the CLI never runs framework detection;
# git-connected builds must stay disabled on the Netlify dashboard so
# nothing builds from main.
[build]
publish = "dist"
command = "true"
