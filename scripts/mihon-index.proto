syntax = "proto3";

package mihon.extensionstore;

// Mirror of Mihon's NetworkExtensionStore wire format (field numbers
// verified against real upstream index.pb bytes, Keiyoushi/Cursed):
// store 1=name 2=badgeLabel 3=signingKey 4=contact 101=extensionList
// (102=extensionListUrl is absent upstream and never emitted);
// extension 1..8 with sources at field 8; resources 1=apkUrl 2=iconUrl
// plus Keiyoushi's jarUrl at field 501; source 1=id(int64) 2=name
// 3=language 4=homeUrl 5=mirrorUrls[] (7=message is unused upstream).
// Note: Aniyomi-side stores (Secozzi) encode sources at field 9 — this
// schema regenerates Mihon sources only.
message NetworkExtensionStore {
    string name = 1;
    string badge_label = 2;
    string signing_key = 3;
    Contact contact = 4;
    ExtensionList extension_list = 101;
    string extension_list_url = 102;
}

message Contact {
    string website = 1;
    string discord = 2;
}

message ExtensionList {
    repeated Extension extensions = 1;
}

message Extension {
    string name = 1;
    string package_name = 2;
    Resources resources = 3;
    string extension_lib = 4;
    int64 version_code = 5;
    string version_name = 6;
    ContentWarning content_warning = 7;
    repeated Source sources = 8;
}

message Resources {
    string apk_url = 1;
    string icon_url = 2;
    string jar_url = 501;
}

message Source {
    int64 id = 1;
    string name = 2;
    string language = 3;
    string home_url = 4;
    repeated string mirror_urls = 5;
}

enum ContentWarning {
    CONTENT_WARNING_UNSPECIFIED = 0;
    CONTENT_WARNING_SAFE = 1;
    CONTENT_WARNING_MIXED = 2;
    CONTENT_WARNING_NSFW = 3;
}
