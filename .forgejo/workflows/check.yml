name: Check Extension Updates

on:
    schedule:
        - cron: '0 */4 * * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check extension updates
              id: update
              run: pnpm run update:check

            - name: Format extensions.json
              if: steps.update.outputs.updated == 'true'
              run: pnpm run format

            - name: Commit and push changes
              if: steps.update.outputs.updated == 'true'
              run: |
                  git config --local user.name "forgejo-actions[bot]"
                  git config --local user.email "forgejo-actions[bot]@noreply.noz.one"
                  git add extensions.json
                  git diff-index --quiet HEAD || git commit -m "chore: update extensions.json"
                  git push
